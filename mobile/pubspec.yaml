name: dating_app
description: Dating & Live Calling App
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.2.0

  # HTTP
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # WebSocket
  socket_io_client: ^2.0.3+1

  # Firebase
  firebase_core: ^2.27.1
  firebase_auth: ^4.17.9
  firebase_messaging: ^14.7.20
  google_sign_in: ^6.2.1

  # Agora RTC
  agora_rtc_engine: ^6.3.2

  # Razorpay
  razorpay_flutter: ^1.3.5

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  fl_chart: ^0.67.0
  intl: ^0.18.1
  timeago: ^3.6.1
  country_code_picker: ^3.0.0

  # Misc
  uuid: ^4.4.0
  flutter_local_notifications: ^17.1.2
  wakelock_plus: ^1.1.4
  flutter_ringtone_player: ^4.0.0
  record: 5.1.0
  path_provider: ^2.1.3

dependency_overrides:
  record_platform_interface: 1.2.0
  record_linux: 0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
  # fonts:
  #   To add custom fonts, download Poppins from Google Fonts and place the .ttf files in assets/fonts/
  #   then uncomment the lines below:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
