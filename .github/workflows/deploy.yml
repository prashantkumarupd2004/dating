name: Deploy to AWS EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH (PM2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e

            APP_DIR="/home/${{ secrets.EC2_USER }}/dating-app"
            cd $APP_DIR

            # 1. Pull latest code from GitHub
            echo "📦 Pulling latest code..."
            git pull origin main

            # 2. Write backend .env from GitHub secret (if secret is set)
            if [ -n "${{ secrets.BACKEND_ENV }}" ]; then
              echo "${{ secrets.BACKEND_ENV }}" > backend/.env
              echo "✅ backend/.env updated"
            fi

            # 3. Install dependencies (production only)
            echo "📦 Installing backend dependencies..."
            cd backend
            npm ci --omit=dev

            # 4. Generate Prisma client
            echo "🔧 Generating Prisma client..."
            npx prisma generate

            # 5. Run any pending DB migrations (safe in production)
            echo "🗃️ Running DB migrations..."
            npx prisma migrate deploy

            # 6. Build TypeScript → dist/
            echo "🔨 Building TypeScript..."
            npm run build

            # 7. Reload backend with PM2 (zero-downtime)
            echo "🚀 Reloading PM2 process..."
            pm2 reload milan-backend --update-env

            # 8. Save PM2 state so it survives reboots
            pm2 save

            echo "✅ Deployment complete!"
            pm2 list
