version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: milan_backend
    restart: always
    env_file: ./backend/.env
    environment:
      - NODE_ENV=production
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - milan_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: milan_admin
    restart: always
    env_file: ./admin/.env.local
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    networks:
      - milan_net
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: milan_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads_data:/var/www/uploads:ro
    networks:
      - milan_net
    depends_on:
      - backend
      - admin

volumes:
  uploads_data:

networks:
  milan_net:
    driver: bridge
